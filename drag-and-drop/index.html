<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>drag and drop</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>Simple Kanban Board</h1>

      <div class="board">
        <!-- List 1 -->
        <div class="list" id="list1">
          <h2>To Do</h2>
          <div class="card" draggable="true" id="card1">Wash Dishess</div>
          <div class="card" draggable="true" id="card2">Buy Groceries</div>
        </div>
        <!-- List 2 -->
        <div class="list" id="list1">
          <h2>In Progress</h2>
          <div class="card" draggable="true" id="card3">Learn to code</div>
        </div>
        <!-- List 3 -->
        <div class="list" id="list1">
          <h2>Done</h2>
          <div class="card" draggable="true" id="card4">Learn to code</div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
